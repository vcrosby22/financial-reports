name: Daily Market Report

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/daily-report.yml'
  schedule:
    # 12:00 UTC = 7:00 AM ET (pre-market, weekdays)
    - cron: '0 12 * * 1-5'
    # 21:30 UTC = 4:30 PM ET (post-market close, weekdays)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-report:
    runs-on: ubuntu-latest

    env:
      TZ: America/New_York

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional cascade-data API keys; missing keys degrade gracefully.
          HORMUZ_API_KEY: ${{ secrets.HORMUZ_API_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python -m src report --output docs/index.html --no-open

      - name: Verify FRED/macro is present in HTML
        run: |
          test -f docs/index.html
          grep -qE 'Macroeconomic Indicators \(FRED\)|Macro \(FRED\)' docs/index.html \
            || { echo "::error::Report HTML missing FRED/macro markers — check FRED_API_KEY secret and network."; exit 1; }

      - name: Persist data history files
        run: |
          # Race-safe pattern. Avoid rebase on append-only JSONL logs:
          # rebase conflicts can leave the tree mid-merge and clobber
          # the freshly-generated docs/index.html, which then deploys
          # as stale HTML to gh-pages. Incident: 2026-05-13 run
          # 25810865827. Instead we (1) save the fresh report aside,
          # (2) hard-reset to origin/main, (3) re-write our data files
          # on top, (4) commit + push, (5) restore the fresh report so
          # the deploy step ships today's content.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Save the freshly-generated report and our updated data files
          #    out of the worktree so reset --hard can't wipe them.
          mkdir -p /tmp/run-snapshot
          if [ -f docs/index.html ]; then
            cp docs/index.html /tmp/run-snapshot/index.html
          fi
          DATA_FILES="data/risk_score_history.jsonl data/risk_score_daily.json data/supply_chain_history.jsonl"
          changed=false
          for f in $DATA_FILES; do
            if [ -f "$f" ]; then
              cp "$f" "/tmp/run-snapshot/$(basename $f)"
              changed=true
            fi
          done

          if [ "$changed" = true ]; then
            for i in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              for f in $DATA_FILES; do
                bn="/tmp/run-snapshot/$(basename $f)"
                if [ -f "$bn" ]; then
                  cp "$bn" "$f"
                  git add "$f"
                fi
              done
              if git diff --cached --quiet; then
                echo "Data files unchanged vs origin — nothing to commit."
                break
              fi
              git commit -m "data: snapshot (${{ github.event_name }})"
              if git push origin main; then
                echo "data history pushed on attempt $i"
                break
              fi
              echo "push attempt $i rejected — refetching"
              sleep $((i * 3))
            done
          else
            echo "No data history files to persist."
          fi

          # 5. Restore the freshly-generated report for the deploy step.
          if [ -f /tmp/run-snapshot/index.html ]; then
            mkdir -p docs
            cp /tmp/run-snapshot/index.html docs/index.html
          fi

      # peaceiris/actions-gh-pages@v4 still ships Node 20 as of 2026-05-13.
      # Tracking PR #1143 upstream for Node 24 bump. Revisit before
      # June 2, 2026 — at that point either: (a) bump to a Node-24
      # release if shipped, (b) migrate to actions/upload-pages-artifact
      # + actions/deploy-pages, or (c) set
      # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true as a temporary escape.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
          commit_message: "Update report — ${{ github.event_name }}"

      - name: Close open report alerts on success
        if: success()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'report-alert',
              state: 'open',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Report succeeded — auto-closing.\n\n[Run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      - name: Create alert issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'report-alert',
              state: 'open',
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Another failure — ${context.eventName} trigger.\n\n[Run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Market Report failed — ${new Date().toISOString().split('T')[0]}`,
              body: [
                `The Daily Market Report workflow failed.`,
                ``,
                `| Detail | Value |`,
                `|--------|-------|`,
                `| **Run** | [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
                `| **Trigger** | ${context.eventName} |`,
                `| **Time (UTC)** | ${new Date().toISOString()} |`,
                ``,
                `Check the run logs for the failing step.`,
              ].join('\n'),
              labels: ['report-alert'],
            });
